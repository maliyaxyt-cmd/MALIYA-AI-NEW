<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Maliya AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #1d2b55,
                    #070b16 65%
                );

            color: white;

            padding: 20px;
        }


        .login-box {

            width: 100%;

            max-width: 420px;

            padding: 40px 30px;

            text-align: center;

            background: rgba(
                15,
                23,
                42,
                0.92
            );

            border: 1px solid #2d395a;

            border-radius: 25px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.45);
        }


        .logo {

            font-size: 60px;

            margin-bottom: 15px;
        }


        h1 {

            font-size: 28px;

            margin-bottom: 8px;
        }


        .subtitle {

            color: #8c98b5;

            margin-bottom: 30px;

            line-height: 1.5;
        }


        #googleLogin {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 13px;

            background: white;

            color: #202124;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            transition: 0.2s;
        }


        #googleLogin:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.25);
        }


        .google-icon {

            font-size: 20px;
        }


        #status {

            margin-top: 20px;

            min-height: 22px;

            color: #8c98b5;

            font-size: 13px;
        }


        .footer {

            margin-top: 30px;

            color: #5f6b87;

            font-size: 11px;
        }

    </style>

</head>


<body>


    <div class="login-box">

        <div class="logo">
            🤖
        </div>


        <h1>
            Maliya AI
        </h1>


        <p class="subtitle">

            Your personal AI assistant

            <br>

            Google Account එකෙන් login වෙන්න.

        </p>


        <button id="googleLogin">

            <span class="google-icon">
                G
            </span>

            Continue with Google

        </button>


        <div id="status"></div>


        <div class="footer">

            Maliya AI

        </div>

    </div>



    <!-- Firebase -->

    <script type="module">

        import {
            initializeApp
        } from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


        import {
            getAuth,
            GoogleAuthProvider,
            signInWithPopup,
            onAuthStateChanged
        } from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


        // =====================================
        // 🔥 YOUR FIREBASE CONFIG
        // =====================================

        const firebaseConfig = {
  apiKey: "AIzaSyDSLOqXkdFYu-pZZlGi7KF0CObPPJtJxs8",
  authDomain: "maliya-ai.firebaseapp.com",
  projectId: "maliya-ai",
  storageBucket: "maliya-ai.firebasestorage.app",
  messagingSenderId: "1078836043420",
  appId: "1:1078836043420:web:a08a5c669b54229fecd759",
  measurementId: "G-KY26PK219Z"
};
        // =====================================
        // FIREBASE
        // =====================================

        const app =
            initializeApp(
                firebaseConfig
            );


        const auth =
            getAuth(app);


        const provider =
            new GoogleAuthProvider();


        const button =
            document.getElementById(
                "googleLogin"
            );


        const status =
            document.getElementById(
                "status"
            );


        // =====================================
        // CHECK LOGIN
        // =====================================

        onAuthStateChanged(
            auth,
            function(user) {

                if (user) {

                    window.location.href =
                        "/";

                }

            }
        );


        // =====================================
        // GOOGLE LOGIN
        // =====================================

        button.addEventListener(
            "click",
            async function() {

                try {

                    button.disabled =
                        true;

                    status.textContent =
                        "Google Account එකෙන් login වෙමින්...";


                    await signInWithPopup(
                        auth,
                        provider
                    );


                    status.textContent =
                        "✅ Login successful!";


                    window.location.href =
                        "/";


                }
                catch (error) {

                    console.error(
                        error
                    );


                    button.disabled =
                        false;


                    status.textContent =
                        "❌ Login failed: " +
                        error.message;

                }

            }
        );

    </script>

</body>

</html>
